<!DOCTYPE html>
<!-- Still Here. Engine: Phaser 3.90.0 (phaser.min.js, local copy, no CDN). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Still Here</title>
  <style>
    html, body {
      margin: 0; padding: 0; background: #000; overflow: hidden;
      height: 100%; height: 100dvh; width: 100%;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* #safe keeps the game clear of notches; Phaser fits itself into #game */
    #safe {
      position: fixed; inset: 0; box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #game { position: relative; width: 100%; height: 100%; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    /* Portrait on a phone: ask to rotate (the game is paused behind it) */
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 10; background: #0b0b1a; color: #fff3a0;
      flex-direction: column; align-items: center; justify-content: center;
      font: bold 20px/1.3 monospace; text-align: center;
    }
    #rotate .phone {
      width: 44px; height: 76px; border: 5px solid #fff3a0; border-radius: 8px; margin-bottom: 22px;
      animation: rock 1.6s ease-in-out infinite;
    }
    @keyframes rock { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } }
  </style>
</head>
<body>
  <div id="safe"><div id="game"></div></div>
  <div id="rotate"><div class="phone"></div><div>Rotate your phone</div></div>

  <script src="phaser.min.js"></script>
  <script src="src/constants.js"></script>
  <script src="src/state.js"></script>
  <script src="src/cards.js"></script>
  <script src="src/data/chapters.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/placeholders.js"></script>
  <script src="src/ui/pixelText.js"></script>
  <script src="src/ui/fx.js"></script>
  <script src="src/ui/button.js"></script>
  <script src="src/ui/silhouette.js"></script>
  <script src="src/ui/topBar.js"></script>
  <script src="src/ui/cardPopup.js"></script>
  <script src="src/ui/patchAnim.js"></script>
  <script src="src/ui/lane.js"></script>
  <script src="src/scenes/ChapterBase.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MoonScene.js"></script>
  <script src="src/scenes/MarsScene.js"></script>
  <script src="src/scenes/HomeScene.js"></script>
  <script src="src/scenes/AlbumHallScene.js"></script>
  <script src="src/scenes/CertificateScene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
